<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" width="1200" height="800">
  <!-- Fondo del living -->
  <rect width="1200" height="800" fill="#FFF8F0"/>
  
  <!-- Piso -->
  <rect x="0" y="500" width="1200" height="300" fill="#E8D5C4"/>
  
  <!-- Ventana (Eco) -->
  <rect x="50" y="50" width="300" height="300" fill="#B0D4F1" stroke="#D48C70" stroke-width="12" rx="10"/>
  <line x1="200" y1="50" x2="200" y2="350" stroke="#D48C70" stroke-width="8"/>
  <line x1="50" y1="200" x2="350" y2="200" stroke="#D48C70" stroke-width="8"/>
  <!-- Paisaje afuera -->
  <circle cx="150" cy="120" r="30" fill="#E8C06A"/>
  <polygon points="300,350 350,250 400,350" fill="#8FA88A"/>
  <polygon points="250,350 300,270 350,350" fill="#6B8BA4"/>
  
  <!-- Sillón con pulpo (Care) -->
  <rect x="500" y="300" width="200" height="150" fill="#9B7EBD" rx="30"/>
  <rect x="480" y="400" width="240" height="40" fill="#7B5E9B" rx="15"/>
  <!-- Pulpo -->
  <ellipse cx="600" cy="340" rx="40" ry="30" fill="#D4A5B9"/>
  <circle cx="580" cy="330" r="5" fill="#4A4A4A"/>
  <circle cx="610" cy="330" r="5" fill="#4A4A4A"/>
  <path d="M 570 360 Q 560 390 540 400" stroke="#D4A5B9" stroke-width="8" fill="none" stroke-linecap="round"/>
  <path d="M 590 370 Q 585 400 575 410" stroke="#D4A5B9" stroke-width="8" fill="none" stroke-linecap="round"/>
  <path d="M 610 370 Q 615 400 625 410" stroke="#D4A5B9" stroke-width="8" fill="none" stroke-linecap="round"/>
  <path d="M 630 360 Q 640 390 660 400" stroke="#D4A5B9" stroke-width="8" fill="none" stroke-linecap="round"/>
  <!-- Taza de café -->
  <rect x="625" y="315" width="15" height="12" fill="#FFF" rx="3"/>
  <path d="M 640 318 Q 645 320 640 326" stroke="#FFF" stroke-width="2" fill="none"/>
  
  <!-- Repisa con objetos 3D -->
  <rect x="850" y="50" width="300" height="15" fill="#8B5E3C" rx="5"/>
  <!-- Objetos en la repisa -->
  <rect x="880" y="20" width="30" height="30" fill="#E8825A" rx="5"/>
  <circle cx="970" cy="35" r="15" fill="#F4976C"/>
  <polygon points="1030,50 1050,20 1070,50" fill="#4A4A4A"/>
  <rect x="1100" y="15" width="25" height="35" fill="#8FA88A" rx="8"/>
  
  <!-- Cuadro de Kodyan HQ -->
  <rect x="450" y="50" width="100" height="70" fill="#FFF" stroke="#D48C70" stroke-width="6" rx="5"/>
  <text x="500" y="95" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#4A4A4A" font-weight="bold">Kodyan HQ</text>
  
  <!-- Alfombra -->
  <ellipse cx="600" cy="550" rx="300" ry="60" fill="#D48C70" opacity="0.3"/>
</svg>
